name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-linux-test.*"
      - "!v*-macos-test.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which release target to build"
        type: choice
        required: true
        default: macos-universal
        options:
          - macos-universal
          - windows-x64
          - linux-x64
          - linux-arm64
          - macos-linux
          - all
      tag:
        description: "Release tag to publish to (for example: v0.1.13)"
        type: string
        required: true
      replace_existing:
        description: "Replace the existing release and move its tag to this commit (target: all)"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Publish a preview release without changing Latest"
        type: boolean
        required: false
        default: false
      release_name:
        description: "Optional release display name"
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x64:
    name: Build Assets (windows-x64)
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows-x64'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build patched Croc engine
        run: python scripts/prepare_croc.py --target x86_64-pc-windows-msvc

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binary
        # Release builds fail if the patched payload has not been prepared.
        run: cargo build --locked --release --features release-single-instance

      - name: Package Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/databeam.exe" "dist/databeam_windows-x64.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error

  build-macos-universal:
    name: Build Assets (macos-universal)
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos-universal' || github.event.inputs.target == 'macos-linux'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build patched Croc engines for both architectures
        run: python scripts/prepare_croc.py --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binaries
        run: |
          cargo build --locked --release --features release-single-instance --target aarch64-apple-darwin
          cargo build --locked --release --features release-single-instance --target x86_64-apple-darwin

      - name: Verify non-Windows platform policy
        run: cargo test --locked --features release-single-instance --bin databeam non_windows_

      - name: Verify macOS updater architecture checks
        run: cargo test --locked --bin databeam macos_lipo_

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Package macOS universal app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo bundle --release --features release-single-instance --target aarch64-apple-darwin --format osx --binary-path target/aarch64-apple-darwin/release/databeam

          app_path="target/aarch64-apple-darwin/release/bundle/osx/DataBeam.app"
          if [ ! -d "${app_path}" ]; then
            echo "No macOS app bundle produced at ${app_path}"
            find target/aarch64-apple-darwin/release -maxdepth 6 -type d -name '*.app' | sort
            exit 1
          fi

          # 1) Create the aarch64 DMG first (smaller size for Apple Silicon natively)
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          dmg_path_aarch="dist/databeam_macos-aarch64.dmg"
          hdiutil create -volname "DataBeam" -srcfolder "${app_path}" -ov -format UDZO "${dmg_path_aarch}"

          # 2) Now merge into Universal App Bundle!
          echo "Merging into Universal binary..."
          lipo -create -output "${app_path}/Contents/MacOS/databeam" \
               target/aarch64-apple-darwin/release/databeam \
               target/x86_64-apple-darwin/release/databeam

          # Ad-hoc sign again after replacing binary
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          dmg_path_univ="dist/databeam_macos-universal.dmg"
          hdiutil create -volname "DataBeam" -srcfolder "${app_path}" -ov -format UDZO "${dmg_path_univ}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Assets (linux-${{ matrix.arch }})
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-x64' || github.event.inputs.target == 'linux-arm64' || github.event.inputs.target == 'macos-linux'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event.inputs.target == 'linux-x64' && '["x64"]' || github.event.inputs.target == 'linux-arm64' && '["arm64"]' || '["x64", "arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build patched Croc engine
        run: python scripts/prepare_croc.py --target ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfuse2 \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxdo-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxrandr-dev \
            mesa-common-dev \
            patchelf \
            squashfs-tools

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binary
        run: cargo build --locked --release --features release-single-instance

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Verify non-Windows platform policy
        run: |
          cargo test --locked --features release-single-instance --bin databeam non_windows_
          cargo test --locked --features release-single-instance --bin databeam app_update::install::tests

      - name: Package Linux ${{ matrix.arch }} AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cargo bundle --release --features release-single-instance --format appimage --binary-path target/release/databeam
          appimage_path="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "${appimage_path}" ]; then
            echo "No .AppImage produced under target/release/bundle/appimage"
            find target/release -maxdepth 6 -type f | sort
            exit 1
          fi
          python scripts/bundle_appimage_runtime.py "${appimage_path}"
          cp "${appimage_path}" "dist/databeam_linux-${{ matrix.arch }}.AppImage"

      - name: Verify updater asset selection
        run: cargo test --locked --bin databeam correct_assets_are_selected_on_all_shipping_platforms

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - build-windows-x64
      - build-macos-universal
      - build-linux
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPLACE_EXISTING: ${{ github.event.inputs.replace_existing || 'false' }}
          RELEASE_TARGET: ${{ github.event.inputs.target }}
          RELEASE_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          RELEASE_NAME: ${{ github.event.inputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${REPLACE_EXISTING}" = "true" ] && [ "${RELEASE_TARGET}" != "all" ]; then
            echo "Replacing a release tag requires rebuilding all targets."
            exit 1
          fi

          preview_flags=()
          release_title="DataBeam ${RELEASE_TAG}"
          if [ -n "${RELEASE_NAME}" ]; then
            release_title="${RELEASE_NAME}"
          fi
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            preview_flags=(--prerelease --latest=false)
            release_title="${release_title} Preview"
          fi

          # Keep new releases in draft until assets and notes have been uploaded.
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Creating release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "${release_title}" --generate-notes --draft "${preview_flags[@]}"
          fi

          # Merge or generate SHA256SUMS.txt
          mkdir -p /tmp/existing_release
          if gh release download "${RELEASE_TAG}" --pattern "SHA256SUMS.txt" --dir /tmp/existing_release 2>/dev/null; then
            echo "Existing SHA256SUMS.txt found on release. Merging checksums..."
            cd dist
            ls -1 > /tmp/new_files.txt
            grep -v -F -f /tmp/new_files.txt /tmp/existing_release/SHA256SUMS.txt > /tmp/merged_sha.txt || true
            sha256sum * >> /tmp/merged_sha.txt
            sort -k2 -u /tmp/merged_sha.txt > SHA256SUMS.txt
            cd ..
          else
            echo "Generating fresh SHA256SUMS.txt..."
            (cd dist && sha256sum * > SHA256SUMS.txt)
          fi

          echo "Uploading release assets with --clobber..."
          gh release upload "${RELEASE_TAG}" dist/* --clobber

          if [ "${REPLACE_EXISTING}" = "true" ]; then
            # Use the workflow token so updating the existing tag does not
            # trigger a second release run. Retarget only after all uploads.
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true > /dev/null
          fi

          notes_path="release-notes/${RELEASE_TAG}.md"
          if [ -f "${notes_path}" ]; then
            gh release edit "${RELEASE_TAG}" --notes-file "${notes_path}"
          fi

          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            gh release edit "${RELEASE_TAG}" --title "${release_title}" --draft=false --prerelease --latest=false
          else
            gh release edit "${RELEASE_TAG}" --title "${release_title}" --draft=false --prerelease=false --latest
          fi

