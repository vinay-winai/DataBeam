name: Updater Bootstrap Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which release target to build"
        type: choice
        required: true
        default: macos-universal
        options:
          - macos-universal
          - windows-x64
          - linux-x64
          - macos-linux
          - all
      tag:
        description: "Release tag to publish to (for example: v0.1.13)"
        type: string
        required: true
      replace_existing:
        description: "Replace the existing release and move its tag to this commit (target: all)"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Publish a preview release without changing Latest"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x64:
    name: Build Assets (windows-x64)
    if: false
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build patched Croc engine
        run: python scripts/prepare_croc.py --target x86_64-pc-windows-msvc

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binary
        # Release builds fail if the patched payload has not been prepared.
        run: cargo build --locked --release --features release-single-instance

      - name: Package Windows x64 executable
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/databeam.exe" "dist/databeam_v${version}_windows-x64.exe"
          $package = "target/windows-release-package"
          New-Item -ItemType Directory -Force -Path "$package/LICENSES" | Out-Null
          Copy-Item "target/release/databeam.exe" "$package/databeam.exe"
          Copy-Item "LICENSE", "THIRD_PARTY_NOTICES.md" $package
          Copy-Item "LICENSES/*.txt" "$package/LICENSES"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/databeam_v${version}_windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error

  build-macos-universal:
    name: Build Assets (macos-universal)
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos-universal' || github.event.inputs.target == 'macos-linux'
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build patched Croc engines for both architectures
        run: python scripts/prepare_croc.py --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binaries
        run: |
          cargo build --locked --release --features release-single-instance --target aarch64-apple-darwin
          cargo build --locked --release --features release-single-instance --target x86_64-apple-darwin

      - name: Verify non-Windows platform policy
        run: cargo test --locked --bin databeam non_windows_

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Package macOS universal app bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cargo bundle --release --features release-single-instance --target aarch64-apple-darwin --format osx --binary-path target/aarch64-apple-darwin/release/databeam

          app_path="target/aarch64-apple-darwin/release/bundle/osx/DataBeam.app"
          if [ ! -d "${app_path}" ]; then
            echo "No macOS app bundle produced at ${app_path}"
            find target/aarch64-apple-darwin/release -maxdepth 6 -type d -name '*.app' | sort
            exit 1
          fi

          # 1) Create the aarch64 DMG first (smaller size for Apple Silicon natively)
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          dmg_path_aarch="dist/databeam_updater-test_v${version}_macos-aarch64.dmg"
          hdiutil create -volname "DataBeam" -srcfolder "${app_path}" -ov -format UDZO "${dmg_path_aarch}"

          # 2) Now merge into Universal App Bundle!
          echo "Merging into Universal binary..."
          lipo -create -output "${app_path}/Contents/MacOS/databeam" \
               target/aarch64-apple-darwin/release/databeam \
               target/x86_64-apple-darwin/release/databeam

          # Ad-hoc sign again after replacing binary
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          dmg_path_univ="dist/databeam_updater-test_v${version}_macos-universal.dmg"
          hdiutil create -volname "DataBeam" -srcfolder "${app_path}" -ov -format UDZO "${dmg_path_univ}"

      - name: Add updater test instructions and checksums
        shell: bash
        run: |
          cp investigations/macos-updater-bootstrap.md dist/README-updater-test.md
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: databeam-macos-updater-test
          path: dist/*
          if-no-files-found: error

  build-linux-x64:
    name: Build Assets (linux-x64)
    if: false
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build patched Croc engine
        run: python scripts/prepare_croc.py --target x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfuse2 \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxdo-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mesa-common-dev \
            patchelf

      - name: Update Cargo.toml version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

      - name: Build release binary
        run: cargo build --locked --release --features release-single-instance

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Verify non-Windows platform policy
        run: cargo test --locked --bin databeam non_windows_

      - name: Package Linux x64 deb and AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist

          cargo bundle --release --features release-single-instance --format deb --binary-path target/release/databeam
          deb_path="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "${deb_path}" ]; then
            echo "No .deb produced under target/release/bundle/deb"
            find target/release -maxdepth 5 -type f | sort
            exit 1
          fi
          cp "${deb_path}" "dist/databeam_v${version}_linux-x64.deb"

          cargo bundle --release --features release-single-instance --format appimage --binary-path target/release/databeam
          appimage_path="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "${appimage_path}" ]; then
            echo "No .AppImage produced under target/release/bundle/appimage"
            find target/release -maxdepth 6 -type f | sort
            exit 1
          fi
          cp "${appimage_path}" "dist/databeam_v${version}_linux-x64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-x64
          path: dist/*
          if-no-files-found: error

