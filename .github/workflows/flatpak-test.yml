name: Linux Flatpak test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Separate Linux test release tag"
        required: true
        default: "v0.7.3-linux-test.1"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Linux and Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder desktop-file-utils appstream-util dbus \
            libasound2-dev libglib2.0-dev libgtk-3-dev libssl-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxrandr-dev mesa-common-dev
      - name: Prepare patched Croc engine
        run: python scripts/prepare_croc.py --target '${{ matrix.arch }}-unknown-linux-gnu'
      - name: Build native test application
        run: cargo build --locked --release --features release-single-instance --bin databeam
      - name: Test Linux platform behavior and embedded Croc
        run: |
          cargo test --locked --features release-single-instance --bin databeam non_windows_
          cargo test --locked --features release-single-instance --bin databeam croc_bundled_engine_extracts_and_reports_patched_version
      - name: Install Flatpak build runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build Flatpak test bundle
        run: dbus-run-session -- python scripts/package_flatpak.py --arch '${{ matrix.arch }}'
      - name: Check actual sandbox permissions and runtime tools
        run: |
          bundle="dist/databeam_linux-${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}.flatpak"
          flatpak install --user -y --noninteractive "$bundle"
          flatpak info --user --show-permissions com.vinaywinai.databeam//testing
          dbus-run-session -- flatpak run --command=sh com.vinaywinai.databeam//testing -ec '
            test "$FLATPAK_ID" = com.vinaywinai.databeam
            test -x /app/bin/databeam
            command -v curl
            command -v gdbus
            command -v gio
            test -n "$XDG_CONFIG_HOME"
            mkdir -p "$XDG_CONFIG_HOME/databeam-flatpak-check"
            printf sandbox-ok > "$XDG_CONFIG_HOME/databeam-flatpak-check/result"
            test "$(cat "$XDG_CONFIG_HOME/databeam-flatpak-check/result")" = sandbox-ok
            check_dir=$(mktemp -d "$HOME/databeam-flatpak-check.XXXXXX")
            printf home-ok > "$check_dir/result"
            test "$(cat "$check_dir/result")" = home-ok
            rm "$check_dir/result"
            rmdir "$check_dir"
            curl --fail --silent --show-error --proto =https --max-time 30 https://raw.githubusercontent.com/vinay-winai/DataBeam/main/troubleshoot.md >/dev/null
          '
      - name: Upload test bundles
        uses: actions/upload-artifact@v6
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  draft:
    name: Stage separate Linux test release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v6
        with:
          pattern: flatpak-*
          merge-multiple: true
          path: dist
      - name: Stage checked assets for publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.flatpak > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "DataBeam Linux Flatpak - test" --draft --prerelease --latest=false \
            --notes-file release-notes/linux-flatpak-test.md
          gh release upload "$RELEASE_TAG" dist/*
