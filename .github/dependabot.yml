version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      desktop-rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Review Iroh version bumps alongside the vendored Sendme engine.
    ignore:
      - dependency-name: "iroh*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
