[package]
name = "databeam"
version = "0.8.0"
edition = "2021"
description = "A beautiful GUI wrapper for croc and sendme file transfer tools"
authors = ["DataBeam <databeam@users.noreply.github.com>"]

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
open = "5"
dirs = "6"
which = "7"
flate2 = "1"
tempfile = "3"
libc = "0.2.182"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
qrcode = "0.14"
rand = "0.9"
sha2 = "0.11"
portable-pty = "0.8"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
sendme_native = { package = "sendme", path = "third_party/sendme", default-features = false }

[features]
default = []
release-single-instance = ["dep:single-instance"]

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
single-instance = { version = "0.3", optional = true }
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
winit = { version = "=0.30.12", default-features = false, features = ["x11", "rwh_06"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[package.metadata.bundle]
name = "DataBeam"
identifier = "com.vinaywinai.databeam"
short_description = "Secure GUI wrapper for croc and sendme"
category = "Productivity"
resources = ["THIRD_PARTY_NOTICES.md", "LICENSES/CROC-MIT.txt"]
icon = [
  "assets/icons/icon-512.png",
  "assets/icons/icon.ico",
  "assets/icons/icon.icns",
]
copyright = "Copyright (c) DataBeam"

[package.metadata.bundle.linux]
use_terminal = false

