[package]
name = "databeam-android"
version = "0.8.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
sendme = { path = "../../third_party/sendme", default-features = false }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
iroh = "1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
[target.'cfg(target_os = "android")'.dependencies]
jni22 = { package = "jni", version = "0.22.4" }
rustls-platform-verifier = "=0.7.1"
[profile.release]
strip = true
[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
